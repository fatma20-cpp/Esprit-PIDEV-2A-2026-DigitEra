<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Digitera</title>
    <link rel="stylesheet" href="view/login.css">
</head>
<body class="auth-neon-page">

<div class="auth-bg-shapes" aria-hidden="true">
    <div class="auth-shape s1"></div>
    <div class="auth-shape s2"></div>
    <div class="auth-shape s3"></div>
    <div class="auth-neon-line nl1"></div>
    <div class="auth-neon-line nl2"></div>
</div>

<div class="auth-center">
    <div class="auth-card auth-card--wide">

        <div class="auth-logo">
            <div class="auth-logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="#0a0e27" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </div>
            <span class="auth-logo-text">Digitera</span>
        </div>

        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Join Digitera — it's free</p>

        <!--PHP_ERROR-->
        <!--PHP_SUCCESS-->

        <form class="auth-form" method="POST" action="index.php?page=register" enctype="multipart/form-data" novalidate>

            <div class="auth-two-col">
                <div class="auth-group">
                    <label class="auth-label" for="nom">Last Name *</label>
                    <input class="auth-input" type="text" id="nom" name="nom"
                           placeholder="Dupont" value="__NOM__" required>
                </div>
                <div class="auth-group">
                    <label class="auth-label" for="prenom">First Name *</label>
                    <input class="auth-input" type="text" id="prenom" name="prenom"
                           placeholder="Marie" value="__PRENOM__" required>
                </div>
            </div>

            <div class="auth-group">
                <label class="auth-label" for="email">Email Address *</label>
                <input class="auth-input" type="email" id="email" name="email"
                       placeholder="you@example.com" value="__EMAIL__" required>
            </div>

            <div class="auth-two-col">
                <div class="auth-group">
                    <label class="auth-label" for="telephone">Phone Number</label>
                    <input class="auth-input" type="tel" id="telephone" name="telephone"
                           placeholder="+216 XX XXX XXX" value="__TELEPHONE__">
                </div>
                <div class="auth-group">
                    <label class="auth-label" for="role">Account Type *</label>
                    <select class="auth-select" id="role" name="role">
                        <option value="client" selected>Client</option>
                        <option value="prestataire">Prestataire</option>
                    </select>
                </div>
            </div>

            <div class="auth-two-col">
                <div class="auth-group">
                    <label class="auth-label" for="password">Password *</label>
                    <div class="auth-pw-wrap">
                        <input class="auth-input" type="password" id="password" name="password"
                               placeholder="Min. 6 characters" required>
                        <button type="button" class="auth-toggle-pw" id="togglePw" tabindex="-1">
                            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="auth-group">
                    <label class="auth-label" for="confirm_password">Confirm Password *</label>
                    <input class="auth-input" type="password" id="confirm_password"
                           name="confirm_password" placeholder="Repeat password" required>
                </div>
            </div>

            <div class="auth-group">
                <label class="auth-label">
                    Profile Photo
                    <span class="auth-label-muted">(optional)</span>
                </label>
                <div class="auth-photo-row">
                    <button type="button" class="auth-photo-btn" id="photoBrowseBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 0 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                        Upload photo
                    </button>
                    <span id="photoFilename" class="auth-photo-name">No file chosen</span>
                    <input type="file" name="photo" id="photoInput" accept="image/*" style="display:none">
                </div>
            </div>

            <button type="submit" class="auth-btn-primary" style="margin-top:.5rem;">
                Create Account
            </button>
        </form>

        <div class="auth-footer" style="margin-top:1.25rem;">
            Already have an account? <a href="index.php?page=login">Sign in</a>
        </div>

    </div>
</div>

<script src="view/login.js"></script>
<script>
document.getElementById('photoBrowseBtn').addEventListener('click', () => {
    document.getElementById('photoInput').click();
});
document.getElementById('photoInput').addEventListener('change', function () {
    const file = this.files[0];
    document.getElementById('photoFilename').textContent = file ? file.name : 'No file chosen';
});
</script>
</body>
</html>
